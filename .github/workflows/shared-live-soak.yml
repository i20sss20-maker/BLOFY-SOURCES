name: Shared live sustained transport soak
on:
  pull_request:
    paths:
      - 'isolated-stream/tools/shared-live-soak.mjs'
      - '.github/workflows/shared-live-soak.yml'
permissions:
  contents: read
jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        viewers: [10, 50, 100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node isolated-stream/tools/shared-live-soak.mjs ${{ matrix.viewers }} 30
