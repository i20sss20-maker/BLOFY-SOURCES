name: Deploy BLOFY Xtream to Azure

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Azure resource group containing the Container App
        required: true
      container_app:
        description: Azure Container App name
        required: true
        default: blofy-gateway

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy source to Azure Container Apps
        shell: bash
        run: |
          az extension add --name containerapp --upgrade --yes
          az containerapp up \
            --name "${{ inputs.container_app }}" \
            --resource-group "${{ inputs.resource_group }}" \
            --source . \
            --ingress external \
            --target-port 8080
      - name: Show deployed URL
        shell: bash
        run: |
          FQDN=$(az containerapp show --name "${{ inputs.container_app }}" --resource-group "${{ inputs.resource_group }}" --query properties.configuration.ingress.fqdn -o tsv)
          echo "https://${FQDN}/admin"
          echo "https://${FQDN}/health"
