name: Deploy BLOFY Sources to Azure Gateway

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'test/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: blofy-sources-azure-production
  cancel-in-progress: false

env:
  AZURE_RG: ${{ vars.BLOFY_AZURE_RG || 'rg-blofy-player' }}
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || '9853cf04-5035-4d82-a47f-461db09fdd9c' }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || 'ec5ef9bb-cb2b-425f-af4a-9baf41b7fc23' }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || '37cef360-5cea-44b8-8a64-5a8094c9a587' }}
  CONTAINER_APP: blofy-gateway

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve existing BLOFY Azure resources
        id: azure
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors >/dev/null
          ACR="$(az acr list -g "$AZURE_RG" --query '[0].name' -o tsv)"
          REG="$(az acr show -n "$ACR" --query loginServer -o tsv)"
          STORAGE="$(az storage account list -g "$AZURE_RG" --query '[0].name' -o tsv)"
          KV="$(az keyvault list -g "$AZURE_RG" --query '[0].name' -o tsv)"
          IDENTITY_ID="$(az containerapp show -g "$AZURE_RG" -n "$CONTAINER_APP" --query 'keys(identity.userAssignedIdentities)[0]' -o tsv)"
          CLIENT_ID="$(az identity show --ids "$IDENTITY_ID" --query clientId -o tsv)"
          FQDN="$(az containerapp show -g "$AZURE_RG" -n "$CONTAINER_APP" --query properties.configuration.ingress.fqdn -o tsv)"
          test -n "$ACR" && test -n "$REG" && test -n "$STORAGE" && test -n "$KV" && test -n "$IDENTITY_ID" && test -n "$CLIENT_ID" && test -n "$FQDN"
          echo "acr=$ACR" >> "$GITHUB_OUTPUT"
          echo "reg=$REG" >> "$GITHUB_OUTPUT"
          echo "storage=$STORAGE" >> "$GITHUB_OUTPUT"
          echo "kv=$KV" >> "$GITHUB_OUTPUT"
          echo "identity_id=$IDENTITY_ID" >> "$GITHUB_OUTPUT"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push unified gateway image
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name '${{ steps.azure.outputs.acr }}'
          IMAGE='${{ steps.azure.outputs.reg }}/blofy/sources:${{ steps.azure.outputs.tag }}'
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Reuse existing Key Vault secrets for Xtream admin
        shell: bash
        run: |
          set -euo pipefail
          KV='${{ steps.azure.outputs.kv }}'
          ID='${{ steps.azure.outputs.identity_id }}'

          retry_az() {
            local attempt
            for attempt in $(seq 1 24); do
              if "$@"; then return 0; fi
              echo "Azure operation busy/failed (attempt $attempt/24); retrying in 10s..." >&2
              sleep 10
            done
            return 1
          }

          retry_az az containerapp secret set -g "$AZURE_RG" -n "$CONTAINER_APP" --secrets \
            "xtream-admin=keyvaultref:https://${KV}.vault.azure.net/secrets/release-admin-password,identityref:${ID}" \
            "xtream-session=keyvaultref:https://${KV}.vault.azure.net/secrets/blofy-admin-token,identityref:${ID}" \
            --only-show-errors >/dev/null

      - name: Update existing gateway only
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://${{ steps.azure.outputs.fqdn }}'

          retry_az() {
            local attempt
            for attempt in $(seq 1 24); do
              if "$@"; then return 0; fi
              echo "Azure operation busy/failed (attempt $attempt/24); retrying in 10s..." >&2
              sleep 10
            done
            return 1
          }

          retry_az az containerapp update -g "$AZURE_RG" -n "$CONTAINER_APP" \
            --image "$IMAGE" \
            --min-replicas 1 \
            --max-replicas 1 \
            --set-env-vars \
              PORT=8080 \
              NODE_ENV=production \
              ACTIVATION_URL=http://blofy-activation \
              RELEASE_URL=http://blofy-releases \
              PUBLIC_BASE_URL="$BASE" \
              XTREAM_PUBLIC_BASE_URL="$BASE" \
              ADMIN_PASSWORD=secretref:xtream-admin \
              SESSION_SECRET=secretref:xtream-session \
              AZURE_STORAGE_ACCOUNT='${{ steps.azure.outputs.storage }}' \
              AZURE_CLIENT_ID='${{ steps.azure.outputs.client_id }}' \
              BLOFY_BLOB_CONTAINER=blofy-xtream \
              DATA_DIR=/tmp/blofy-data \
              SYNC_ON_START=true \
              SYNC_INTERVAL_MS=21600000 \
              SYNC_PROVIDER_CONCURRENCY=3 \
              IA_LIMIT=14000 \
              IA_SERIES_LIMIT=4500 \
              IA_ARABIC_LIMIT=4500 \
              IA_FEDFLIX_LIMIT=6000 \
              IA_PRELINGER_LIMIT=5000 \
              IA_PAGE_CONCURRENCY=3 \
              WIKIMEDIA_LIMIT=2500 \
              WIKIMEDIA_ARABIC_LIMIT=1500 \
              PEERTUBE_LIMIT=6000 \
              PEERTUBE_ARABIC_LIMIT=1500 \
              PEERTUBE_SEED_CONCURRENCY=3 \
              NASA_LIMIT=700 \
              FREE_TV_LIMIT=4000 \
              ENABLE_FREE_TV=true \
              FREE_TV_VALIDATE_ARABIC=true \
              FREE_TV_VALIDATE_CONCURRENCY=12 \
              ENABLE_IPTV_ORG=false \
            --only-show-errors >/dev/null

          retry_az az containerapp ingress update -g "$AZURE_RG" -n "$CONTAINER_APP" \
            --type external --target-port 8080 --transport auto --allow-insecure false \
            --only-show-errors >/dev/null
          retry_az az containerapp ingress traffic set -g "$AZURE_RG" -n "$CONTAINER_APP" \
            --revision-weight latest=100 --only-show-errors >/dev/null

      - name: Verify existing site and new Xtream routes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://${{ steps.azure.outputs.fqdn }}'
          for attempt in $(seq 1 36); do
            code="$(curl -sS --max-time 12 -o /tmp/health.json -w '%{http_code}' "$BASE/health" || true)"
            [ "$code" = 200 ] && break
            [ "$attempt" = 36 ] && { cat /tmp/health.json 2>/dev/null || true; exit 1; }
            sleep 5
          done
          cat /tmp/health.json
          grep -Fq '"mode":"azure-blob"' /tmp/health.json
          node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/health.json','utf8')); if(!h.xtream?.legacyAuth?.ok) process.exit(2); if(Number(h.xtream?.legacyAuth?.accounts||0)<1) process.exit(3); console.log('legacy Xtream accounts bridged:',h.xtream.legacyAuth.accounts)"
          curl -fsS --max-time 15 "$BASE/xtream/health" >/tmp/legacy-xtream-health.json
          cat /tmp/legacy-xtream-health.json
          curl -fsS --max-time 15 "$BASE/xtream" >/tmp/xtream.html
          grep -Fq 'لوحة الإدارة' /tmp/xtream.html
          curl -fsS --max-time 15 "$BASE/sources-admin" >/tmp/sources-admin.html
          grep -Fq 'لوحة الإدارة' /tmp/sources-admin.html
          curl -fsS --max-time 15 "$BASE/player_api.php?username=__probe__&password=__probe__" >/tmp/player-probe.json
          grep -Fq '"auth":0' /tmp/player-probe.json
          check_existing_route() {
            local route="$1" code
            code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$BASE$route" || true)"
            echo "$route=$code"
            [ -n "$code" ] && [ "$code" -ge 200 ] && [ "$code" -lt 500 ]
          }
          check_existing_route /portal
          check_existing_route /admin
          check_existing_route /activation-admin
          check_existing_route /legacy-sources-admin
          check_existing_route /downloads
          echo "Activation admin: $BASE/admin"
          echo "Xtream admin:     $BASE/xtream"
          echo "Xtream host:  $BASE"
