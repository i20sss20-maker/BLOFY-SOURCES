name: Deploy Standalone BLOFY Xtream to Azure

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'test/**'
      - 'infra/azure/standalone.bicep'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: blofy-xtream-azure-production
  cancel-in-progress: true

env:
  AZURE_RG: ${{ vars.BLOFY_AZURE_RG || 'rg-blofy-player' }}
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || '9853cf04-5035-4d82-a47f-461db09fdd9c' }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || 'ec5ef9bb-cb2b-425f-af4a-9baf41b7fc23' }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || '37cef360-5cea-44b8-8a64-5a8094c9a587' }}
  CONTAINER_APP: blofy-xtream

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
      - run: az bicep build --file infra/azure/standalone.bicep --stdout >/dev/null

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve shared Azure infrastructure
        id: azure
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors >/dev/null
          ACR="$(az acr list -g "$AZURE_RG" --query '[0].name' -o tsv)"
          REG="$(az acr show -n "$ACR" --query loginServer -o tsv)"
          STORAGE="$(az storage account list -g "$AZURE_RG" --query '[0].name' -o tsv)"
          KV="$(az keyvault list -g "$AZURE_RG" --query '[0].name' -o tsv)"
          ENV_ID="$(az containerapp env list -g "$AZURE_RG" --query '[0].id' -o tsv)"
          IDENTITY_ID="$(az identity list -g "$AZURE_RG" --query '[0].id' -o tsv)"
          CLIENT_ID="$(az identity show --ids "$IDENTITY_ID" --query clientId -o tsv)"
          test -n "$ACR" && test -n "$REG" && test -n "$STORAGE" && test -n "$KV" && test -n "$ENV_ID" && test -n "$IDENTITY_ID" && test -n "$CLIENT_ID"
          echo "acr=$ACR" >> "$GITHUB_OUTPUT"
          echo "reg=$REG" >> "$GITHUB_OUTPUT"
          echo "storage=$STORAGE" >> "$GITHUB_OUTPUT"
          echo "kv=$KV" >> "$GITHUB_OUTPUT"
          echo "env_id=$ENV_ID" >> "$GITHUB_OUTPUT"
          echo "identity_id=$IDENTITY_ID" >> "$GITHUB_OUTPUT"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push Xtream image
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name '${{ steps.azure.outputs.acr }}'
          IMAGE='${{ steps.azure.outputs.reg }}/blofy/xtream:${{ steps.azure.outputs.tag }}'
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy standalone Xtream Container App
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          FQDN="$(az deployment group create             -g "$AZURE_RG"             --template-file infra/azure/standalone.bicep             --parameters               managedEnvironmentId='${{ steps.azure.outputs.env_id }}'               identityResourceId='${{ steps.azure.outputs.identity_id }}'               identityClientId='${{ steps.azure.outputs.client_id }}'               acrLoginServer='${{ steps.azure.outputs.reg }}'               storageAccountName='${{ steps.azure.outputs.storage }}'               keyVaultName='${{ steps.azure.outputs.kv }}'               image="$IMAGE"             --query 'properties.outputs.fqdn.value' -o tsv)"
          test -n "$FQDN"
          BASE="https://$FQDN"
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Set standalone public URL
        shell: bash
        run: |
          set -euo pipefail
          BASE='${{ steps.deploy.outputs.base }}'
          az containerapp update -g "$AZURE_RG" -n "$CONTAINER_APP"             --set-env-vars               PUBLIC_BASE_URL="$BASE"               XTREAM_PUBLIC_BASE_URL="$BASE"               BLOFY_BUILD_SHA="$GITHUB_SHA"             --only-show-errors >/dev/null

      - name: Verify standalone Xtream end to end
        shell: bash
        run: |
          set -euo pipefail
          BASE='${{ steps.deploy.outputs.base }}'
          FQDN='${{ steps.deploy.outputs.fqdn }}'

          for attempt in $(seq 1 96); do
            code="$(curl -sS --max-time 12 -o /tmp/health.json -w '%{http_code}' "$BASE/health" || true)"
            if [ "$code" = 200 ]; then
              standalone="$(node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/health.json','utf8')); process.stdout.write(String(h.standalone===true))")"
              smoke="$(node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/health.json','utf8')); process.stdout.write(String(h.xtream?.smoke?.ok))")"
              stage="$(node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/health.json','utf8')); process.stdout.write(String(h.xtream?.smoke?.stage||''))")"
              syncing="$(node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/health.json','utf8')); process.stdout.write(String(h.xtream?.syncing===true))")"
              build_sha="$(node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/health.json','utf8')); process.stdout.write(String(h.build?.sha||''))")"
              synced_this_boot="$(node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/health.json','utf8')); const a=Date.parse(h.xtream?.stats?.lastSyncAt||''),b=Date.parse(h.build?.startedAt||''); process.stdout.write(String(Number.isFinite(a)&&Number.isFinite(b)&&a>=b))")"
              echo "Attempt $attempt: build=$build_sha standalone=$standalone smoke=$smoke stage=$stage syncing=$syncing syncedThisBoot=$synced_this_boot"
              if [ "$build_sha" = "$GITHUB_SHA" ] && [ "$standalone" = true ] && [ "$smoke" = true ] && [ "$syncing" = false ] && [ "$synced_this_boot" = true ]; then break; fi
            fi
            [ "$attempt" = 96 ] && { cat /tmp/health.json 2>/dev/null || true; exit 1; }
            sleep 5
          done

          cat /tmp/health.json
          grep -Fq '"mode":"azure-blob"' /tmp/health.json

          node <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const stats=h.xtream?.stats||{};
          const sources=Array.isArray(stats.sources)?stats.sources:[];
          if(String(h.build?.sha||'')!==process.env.GITHUB_SHA) throw new Error('wrong_build_revision');
          const started=Date.parse(h.build?.startedAt||'');
          const synced=Date.parse(stats.lastSyncAt||'');
          if(!Number.isFinite(started)||!Number.isFinite(synced)||synced<started) throw new Error('catalog_not_synced_this_boot');
          const nasa=sources.find(x=>x.id==='nasa');
          const open=sources.find(x=>x.id==='open-arabic-films');
          const total=Number(stats.totalItems||0);
          const arabic=Number(stats.arabic?.total||0);
          if(h.xtream?.syncing===true) throw new Error('catalog_sync_still_running');
          if(!nasa || nasa.enabled!==false || Number(nasa.count||0)!==0) throw new Error('nasa_not_purged');
          if(!open || open.enabled!==true || Number(open.count||0)<1) throw new Error('open_arabic_films_missing');
          if(total>0 && arabic/total<0.95) throw new Error(`arabic_ratio_too_low_${arabic}_of_${total}`);
          console.log(`Arabic-first verified: ${arabic}/${total}; openFilms=${open.count}; NASA=0`);
          NODE

          curl -fsS --max-time 15 "$BASE/admin" >/tmp/admin.html
          grep -Fq 'لوحة الإدارة' /tmp/admin.html

          curl -fsS --max-time 15 "$BASE/player_api.php?username=__probe__&password=__probe__" >/tmp/probe.json
          grep -Fq '"auth":0' /tmp/probe.json

          http_code="$(curl -sS --max-time 12 -o /dev/null -w '%{http_code}' "http://$FQDN/health" || true)"
          echo "HTTP compatibility status: $http_code"

          echo "Standalone Xtream admin: $BASE/admin"
          echo "Standalone Xtream host:  $BASE"
          echo "Legacy HTTP host:         http://$FQDN"
