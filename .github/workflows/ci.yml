name: BLOFY SOURCES CI

on:
  pull_request:
  push:
    branches: [main, xtream-open-catalog-v1]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: bash -n infra/azure/configure-github-oidc.sh
      - run: npm test

  synthetic-decoder-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: isolated-stream/decoder-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/*.test.mjs
      # Also executes the real FFmpeg + FFprobe synthetic decode during Docker build.
      - run: docker build -t blofy-decoder-synthetic-ci .

  isolated-stream-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: isolated-stream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      # Railway builds this Dockerfile and runs npm test in the image.
      # Exercise the exact Docker context, not only repository-local npm test.
      - run: docker build -f Dockerfile -t blofy-isolated-stream-ci .
